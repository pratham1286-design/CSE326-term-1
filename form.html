<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form method="get"><!-- by default form is Get attribute -->
        <h3>Personal Information</h3>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>
        <label for="Age">Age:</label>
        <input type="number" id="Age" name="Age" min="1" max="120" required>
        <br><br>
        <input type="submit" value="Submit">
        <br><br>
        <label for="text">Text:</label>
        <input type="text" id="text" name="text" placeholder="Enter text" required>
        <br><br>
        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required>
        <br><br>
        <input type="time" id="time" name="time" required>
        <br><br>
        <input type="color" id="color" name="color" required>
        <br><br>
        <input type="range" id="range" name="range" min="0" max="100" required>
        <br><br>
        <input type="file" id="file" name="file" required>
        <br><br>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>
        <br>
        <input type="radio" id="female" name="gender" value="female" required>
        <label for="female">Female</label>
        <br><br>
        <input type="checkbox" id="subscribeyes" name="subscribe" value="yes">
        <label for="subscribeyes">Subscribe to newsletter</label>
        <br><br>
        <input type="checkbox" id="subscribeno" name="subscribe" value="no">
        <label for="subscribeno">Do not subscribe to newsletter</label>
        <br><br>
        <label for="search">Search:</label>
        <input type="search" id="search" name="search" placeholder="Search...what you want" required>
        <label for="tel">Phone Number:</label>
        <input type="tel" id="tel" name="tel" placeholder="Enter your phone number" required>
        <br><br>
        <label for="textarea">Message:</label>
        <textarea id="textarea" name="textarea" rows="4" cols="50" placeholder="Enter your message here..." required></textarea>
        <br><br>
        <label for="department">Department:</label>
        <select id="department" name="department" required>
            <option value="">Select a department</option>
            <option value="cse">CSE</option>
            <option value="ece">ECE</option>
            <option value="me">ME</option>
        </select>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
