<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Practice 3</title>
    <script>
        function printTable(){
            const input = document.getElementById("n1").value;
            const result = document.getElementById("result");

            if (input === "") {
                result.textContent = "Please enter a number.";
                return;
            }

            const number = Number(input);
            let table = "";
            for (let i = 1; i <= 10; i++) {
                table += `${number} * ${i} = ${number * i}<br>`;
            }
            result.innerHTML = table;
        }
    </script>
</head>
<body>
    <h1>JavaScript Practice 3</h1>
    
        <label for="number">Enter the Number:</label>
        <input type="number" id="n1" name="number"><br><br>
        <button onclick="printTable()" type="button">Print</button>
    
    <p id="result"></p>
</body>
</html>
