<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAVA PRAC 4</title>
    <script>
        function Factorial() {
            const input = document.getElementById("n1").value;
            const result = document.getElementById("result");

            if (input === "") {
                result.textContent = "Please enter a number.";
                return;
            }

            const number = Number(input);
            if (number < 0) {
                result.textContent = "Factorial is not defined for negative numbers.";
                return;
            }

            let factorial = 1;
            for (let i = 1; i <= number; i++) {
                factorial *= i;
            }
            result.textContent = `Factorial of ${number} is ${factorial}.`;
        }
    </script>
</head>
<body>
    <form>
        <label for="n1">Enter the Number:</label>
        <input type="number" id="n1" name="number"><br><br>
        <button onclick="Factorial()" type="button">Calculate Factorial</button>
    </form>
    <p id="result"></p>
</body>
</html>
