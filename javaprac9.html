<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Practice 9</title>
</head>
<body>
    <script>
        var str ="Hello World";
        document.write(str.length + "<br>");
        document.write(str.toUpperCase() + "<br>");
        document.write(str.toLowerCase() + "<br>");
        document.write(str.charAt(0) + "<br>");
        document.write(str.indexOf("World") + "<br>");
        document.write(str.substring(0, 5) + "<br>");
        var num = [10,20,30,40,50];
        <!-- Using for loop for iterable items which uses the "of" operator -->
        for (var n of num) {
            document.write(n + "<br>");
        }
        let student = {
            name: "John",
            age: 20,
            grade: "A"
        };
        <!-- Using for loop for iterable items which uses the "in" operator -->
        for (var key in student) {
            document.write(key + ": " + student[key] + "<br>");
        }
    </script>
</body>
</html>
