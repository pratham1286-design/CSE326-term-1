<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Example</title>
</head>
<body>
    <h2>My Table</h2>
    <table border="1">
        <tr>
            <th>Sr. No.</th>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Pratham</td>
            <td>20</td>
            <td>Ludhiana</td>
        </tr>
        <tr>
            <td>2</td>
            <td>John</td>
            <td>22</td>
            <td>New York</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Jane</td>
            <td>21</td>
            <td>Los Angeles</td>
        </tr>
    </table>
    
</body>
</html>
